apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose -f ../../compose/compose-dev.yaml convert
    kompose.service.type: loadbalancer
    kompose.version: 1.34.0 (HEAD)
  labels:
    io.kompose.service: frontend
  name: frontend
spec:
  ports:
    - name: "http"
      port: 8089
      targetPort: 80
      nodePort: 30000
  selector:
    io.kompose.service: frontend
  type: LoadBalancer