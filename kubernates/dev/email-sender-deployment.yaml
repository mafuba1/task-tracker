apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f ../../compose/compose-dev.yaml convert
    kompose.version: 1.34.0 (HEAD)
  labels:
    io.kompose.service: email-sender
  name: email-sender
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: email-sender
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f ../../compose/compose-dev.yaml convert
        kompose.version: 1.34.0 (HEAD)
      labels:
        io.kompose.service: email-sender
    spec:
      containers:
        - env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: KAFKA_SERVERS
            - name: SPRING_PROFILES_ACTIVE
              value: dev
          image: mafuba1/task-tracker-email-sender
          name: email-sender
      restartPolicy: Always
